name: Agentic CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install and Start Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama serve &
        sleep 5

    - name: Pull Ollama Model
      run: ollama pull qwen2.5:3b

    - name: Run Evaluation Gate
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL != '' && secrets.OLLAMA_BASE_URL || 'http://localhost:11434' }}
        TEST_DATASET_PATH: test_dataset.json
        EVAL_CONFIG_PATH: eval_threshold_config.json
      run: python run_eval.py

    - name: Upload Evaluation Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evaluation-results
        path: eval_results.json
